# Points libspnav clients (Blender, FreeCAD, ...) at smed's spacenavd-compatible socket.
# Install to ~/.config/environment.d/ (or /usr/lib/environment.d/ from a package); it applies
# to the whole session from the next login. Remove it if smed's spnav socket is switched off
# (`[spnav] enabled = false` in config.toml), or those clients find no socket.
SPNAV_SOCKET=${XDG_RUNTIME_DIR}/spnav.sock
